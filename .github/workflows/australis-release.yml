name: Build and publish Australis v1.4.0

on:
  push:
    branches: [main]
    paths:
      - updates/v1.4.0/**
      - Install-Australis.cmd
      - scripts/build_australis_release.py
      - scripts/test_australis_bootstrap.py
      - scripts/test_australis_release_builder.py
      - scripts/AUSTRALIS-RELEASE.md
      - .github/workflows/australis-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: australis-release-v1.4.0
  cancel-in-progress: false

jobs:
  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse the launcher and installer in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 is required.'}
          $files=@(Get-Item 'updates/v1.4.0/package/Clean-Install-Australis.ps1')
          $files+=@(Get-ChildItem 'updates/v1.4.0/package/Helpers' -Filter '*.ps1' -File)
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors | Format-List | Out-String | Write-Host;throw ('PowerShell syntax failed: '+$file.Name)}
          }
          $launcher=[IO.File]::ReadAllText((Join-Path $pwd 'Install-Australis.cmd'))
          $matches=[regex]::Matches($launcher,'(?ms)^#__AUSTRALIS_BOOTSTRAP_BEGIN__\r?\n(?<code>.*?)^#__AUSTRALIS_BOOTSTRAP_END__\r?$')
          if($matches.Count -ne 1){throw 'Launcher block is incomplete.'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseInput($matches[0].Groups['code'].Value,[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors | Format-List | Out-String | Write-Host;throw 'Launcher PowerShell syntax failed.'}
          Write-Host 'Windows PowerShell 5.1 parsing passed. No live game test was performed.'
      - name: Exercise bootstrap verification with harmless HTTP fixtures
        shell: powershell
        run: |
          python scripts/test_australis_bootstrap.py --pwsh powershell --output bootstrap-windows-results.json
          if($LASTEXITCODE){throw 'Bootstrap verification regression failed.'}

      - name: Check the real controller ABI with official Keel on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temporary=Join-Path $env:RUNNER_TEMP ('Australis-Keel-ABI-'+[guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($temporary)
          try{
            $zip=Join-Path $temporary 'SeaPowerKeel-0.7.0.zip'
            Invoke-WebRequest -Uri 'https://github.com/struckl/SeaPowerKeel/releases/download/v0.7.0/SeaPowerKeel-0.7.0.zip' -OutFile $zip
            if((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9f0a7bd1a9cea705792fbbb2adef0b249b57beaa77e832d3ff0b616aad755e0e'){throw 'Official Keel release checksum differs.'}
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $temporary 'official')
            $library=Join-Path $temporary 'official/SeaPowerKeel/lib/AnchorChain.keel.bin'
            if((Get-FileHash -LiteralPath $library -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e272811050698640a8936834363da91769dbc83e017637e3629c21bca6bea764'){throw 'Official compatibility library checksum differs.'}
            $probeHost=(Get-Process -Id $PID).Path
            & $probeHost -NoLogo -NoProfile -File './updates/v1.4.0/package/Source-and-Checks/Test-Australis-KeelAbi.ps1' -CompatibilityLibrary $library -HarmonyPath (Join-Path $pwd 'updates/v1.3.2/package/loader/BepInEx/core/0Harmony.dll') -ControllerPath (Join-Path $pwd 'updates/v1.4.0/package/payload/RAN.Australis.DeckController.dll') -OutputPath (Join-Path $temporary 'ABI-Windows.json')
            if($LASTEXITCODE -ne 0){throw 'Controller ABI verification failed.'}
            Write-Host 'Managed controller ABI passed. TriggerEntryPoint and live Sea Power hooks were not executed.'
          }finally{Remove-Item -LiteralPath $temporary -Recurse -Force}

  release:
    needs: windows-powershell-51
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUSTRALIS_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Check raw and gzip source packaging fixtures
        run: python3 scripts/test_australis_release_builder.py
      - name: Validate all package hashes and build the complete release
        run: python3 scripts/build_australis_release.py --version "$AUSTRALIS_VERSION"
      - name: Create or resume a draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$AUSTRALIS_VERSION"
          cat > release-assets/RELEASE-NOTES.txt <<'NOTES'
          Migrates Australis installation to the official R.A.T.S. Keel loader. The carrier model, controller DLL, canonical platform, single 99-aircraft class and four normal sister-ship variants are retained. Keel is obtained from its official release and is not bundled.

          Save Install-Australis.cmd once, close Sea Power, and double-click the launcher for installation and future stable updates. It downloads and verifies the complete package; the installer stages the replacement and preserves rollback information.

          Requires an enabled official Keel installation with BepInEx 5. Missing verified starter/patcher files can be installed from that local Keel copy; other loader files are preserved. Release packaging validates all manifest hashes, paths, the single carrier class and the absence of bundled loader binaries. Windows PowerShell 5.1 syntax is checked by this workflow. This is not a live Sea Power or full Windows installation test; scenario loading, geometry, aircraft operations, mechanisms and lighting still require an in-game check.
          NOTES
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" == false ]]; then
              mkdir -p published-assets
              for asset in "Australis-$tag-Windows11.zip" SHA256SUMS.txt Install-Australis.cmd; do
                gh release download "$tag" --pattern "$asset" --dir published-assets
                cmp "release-assets/$asset" "published-assets/$asset" || {
                  echo 'The stable release already exists with different bytes. Bump the version before publishing a changed package.' >&2
                  exit 1
                }
              done
              echo 'AUSTRALIS_RELEASE_ALREADY_VERIFIED=true' >> "$GITHUB_ENV"
              exit 0
            fi
            if [[ "$(jq -r .targetCommitish release-state.json)" != "$GITHUB_SHA" ]]; then
              echo 'An existing draft targets another source commit. Use a new version or review the draft before retrying.' >&2
              exit 1
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "RAN / HMAS Australis $tag" --notes-file release-assets/RELEASE-NOTES.txt
          fi
          gh release upload "$tag" \
            "release-assets/Australis-$tag-Windows11.zip" \
            release-assets/SHA256SUMS.txt \
            release-assets/Install-Australis.cmd \
            release-assets/RELEASE-CHECKS.json --clobber
      - name: Verify uploaded bytes and publish the stable release
        if: env.AUSTRALIS_RELEASE_ALREADY_VERIFIED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v$AUSTRALIS_VERSION"
          mkdir -p uploaded-assets
          for asset in "Australis-$tag-Windows11.zip" SHA256SUMS.txt Install-Australis.cmd RELEASE-CHECKS.json; do
            gh release download "$tag" --pattern "$asset" --dir uploaded-assets
            cmp "release-assets/$asset" "uploaded-assets/$asset"
          done
          (cd uploaded-assets && sha256sum --check SHA256SUMS.txt)
          gh release edit "$tag" --draft=false --latest --notes-file release-assets/RELEASE-NOTES.txt
          gh release view "$tag" --json url,isDraft,isPrerelease
