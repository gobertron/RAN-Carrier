DefaultDescription=AUSTRALIS-CLASS CVN\r\nRoyal Australian Navy - fictional alternative-history carrier\r\n\r\nROLE\r\nNaval strike, fleet air defence and long-range sea control across the Pacific and Indian Oceans. The Australis class represents an alternative Australian carrier programme developed after the Second World War and Korean War, with an emphasis on sustained operations, crew protection and enclosed aviation facilities.\r\n\r\nSHIP PARTICULARS\r\nLength: 370 m\r\nConfigured displacement: approximately 112,000 tonnes\r\nMaximum speed: 30 knots\r\nPropulsion: nuclear power, 280,000 hp and eight waterjet propulsion units\r\nScenario service window: 2025-2055\r\n\r\nAIR OPERATIONS\r\nCapacity: up to 99 aircraft in total\r\nFour 95 m catapults: two forward and two on the port waist\r\nFour aircraft lifts, an angled arrested-recovery lane and three helicopter/VTOL pads\r\nEnclosed hangar and lift arrangements for operations in exposed ocean conditions\r\nExpanded stock-aircraft catalogue covering fixed-wing, STOL, VTOL and helicopters; actual deck compatibility varies by airframe\r\n\r\nDEFENCE AND SENSORS\r\nSix CIWS stations: five fixed and one forward retractable station\r\nTwo 30 mm gun mounts, layered surface-to-air missile launchers and four VLS groups\r\nChaff countermeasures and two towed decoys\r\nAir and surface search, aviation-control radar, fire-control directors, electronic support and defensive/offensive electronic countermeasures\r\n\r\nDECK SYSTEMS\r\nController-managed weapon bays, forward CIWS6 and ICCS deck-control bubble\r\nLanding guidance, navigation lights and deck, hangar, lift-well and tower lighting for night and low-light operations\r\n\r\nCLASS MEMBERS\r\nHMAS Australis 91\r\nHMAS Southern Cross 92\r\nHMAS Federation 93\r\nHMAS Commonwealth 94\r\n\r\nOPERATIONAL NOTES\r\nRequires R.A.T.S. Keel (Workshop3835527459), enabled with its starter and takeover patcher. The separate AnchorChain item is not required. Existing air wings are preserved; 99 is capacity, not an automatic embarked total. Missile and sensor performance follows the configured Sea Power definitions. Mechanisms depend on controller startup and their native threat/flight-traffic conditions.\r\n\r\nv1.4.0: official R.A.T.S. Keel loader migration. Model, window UV repair, aircraft and controller retained. Keel RUNNING alone does not prove active game hooks; check the carrier log and test mechanisms in game.
